name: Telecom Billing Test CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend with Docker Compose
        run: |
          docker compose up -d --build --wait backend

      - name: Verify backend
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 2 \
            --retry-all-errors \
            http://127.0.0.1:8000/health

      - name: Run API tests
        run: |
          pytest -m api -v \
            --junitxml=test-results/api-results.xml

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Show Docker Compose logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose down


  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend with Docker Compose
        run: |
          docker compose up -d --build --wait backend

      - name: Verify backend
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 2 \
            --retry-all-errors \
            http://127.0.0.1:8000/health

      - name: Run contract tests
        run: |
          pytest -m contract -v \
            --junitxml=test-results/contract-results.xml

      - name: Upload contract test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Show Docker Compose logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose down


  ui-tests:
    name: Playwright UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Start application with Docker Compose
        run: |
          docker compose up -d --build --wait

      - name: Verify backend
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 2 \
            --retry-all-errors \
            http://127.0.0.1:8000/health

      - name: Verify frontend
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 2 \
            --retry-all-errors \
            http://127.0.0.1:3000

      - name: Run UI tests
        run: |
          pytest -m ui -v \
            --junitxml=test-results/ui-results.xml \
            --tracing=retain-on-failure \
            --screenshot=only-on-failure

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload UI failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Show Docker Compose logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose down


  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Start application with Docker Compose
        run: |
          docker compose up -d --build --wait

      - name: Verify backend
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 2 \
            --retry-all-errors \
            http://127.0.0.1:8000/health

      - name: Verify frontend
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 2 \
            --retry-all-errors \
            http://127.0.0.1:3000

      - name: Run E2E tests
        run: |
          pytest -m e2e -v \
            --junitxml=test-results/e2e-results.xml \
            --tracing=retain-on-failure \
            --screenshot=only-on-failure

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Show Docker Compose logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose down


  selenium-smokes:
    name: Selenium Compatibility Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Chrome version
        run: |
          google-chrome --version

      - name: Start application with Docker Compose
        run: |
          docker compose up -d --build --wait

      - name: Verify backend
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 2 \
            --retry-all-errors \
            http://127.0.0.1:8000/health

      - name: Verify frontend
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 2 \
            --retry-all-errors \
            http://127.0.0.1:3000

      - name: Run Selenium smoke tests
        run: |
          pytest -m selenium -v \
            --junitxml=test-results/selenium-results.xml

      - name: Upload Selenium test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Show Docker Compose logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose down
  
  verify-aws-oidc:
    name: Verify AWS OIDC
    runs-on: ubuntu-latest

    needs:
      - build-and-push-images

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::006209503329:role/telecom-github-actions-deploy-role
          aws-region: eu-central-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

  verify-ssm-command:
    name: Verify SSM Command
    runs-on: ubuntu-latest

    needs:
      - verify-aws-oidc

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::006209503329:role/telecom-github-actions-deploy-role
          aws-region: eu-central-1

      - name: Send test command to staging EC2
        env:
          EC2_INSTANCE_ID: i-00d20ee3e53df123a
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["echo hello-from-github-actions","hostname","whoami","docker --version"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

  build-and-push-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - api-tests
      - contract-tests
      - ui-tests
      - e2e-tests
      - selenium-smokes

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend Docker metadata
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/telecom-billing-backend
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}

      - name: Extract frontend Docker metadata
        id: frontend-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/telecom-billing-frontend
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    needs:
      - build-and-push-images

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::006209503329:role/telecom-github-actions-deploy-role
          aws-region: eu-central-1

      - name: Deploy staging via SSM
        env:
          EC2_INSTANCE_ID: i-00d20ee3e53df123a
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"cd /home/ubuntu\",
              \"IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.staging.yml pull\",
              \"IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.staging.yml up -d --wait\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Deploying image tag: $IMAGE_TAG"
          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"