name: Telecom Billing Test CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend
        run: |
          uvicorn app.backend.main:app --host 0.0.0.0 --port 8000 &

      - name: Wait for backend
        run: |
          curl --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            http://localhost:8000/health

      - name: Run API tests
        run: |
          pytest -m api -v \
            --junitxml=test-results/api-results.xml

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: test-results/
          if-no-files-found: ignore


  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend
        run: |
          uvicorn app.backend.main:app --host 0.0.0.0 --port 8000 &

      - name: Wait for backend
        run: |
          curl --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            http://localhost:8000/health

      - name: Run contract tests
        run: |
          pytest -m contract -v \
            --junitxml=test-results/contract-results.xml

      - name: Upload contract test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-results
          path: test-results/
          if-no-files-found: ignore


  ui-tests:
    name: Playwright UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Start backend
        run: |
          uvicorn app.backend.main:app --host 0.0.0.0 --port 8000 &

      - name: Wait for backend
        run: |
          curl --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            http://localhost:8000/health

      - name: Start frontend
        run: |
          python -m http.server 3000 --directory app/frontend &

      - name: Wait for frontend
        run: |
          curl --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            http://localhost:3000

      - name: Run UI tests
        run: |
          pytest -m ui -v \
            --junitxml=test-results/ui-results.xml \
            --tracing=retain-on-failure \
            --screenshot=only-on-failure

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload UI failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore


  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Start backend
        run: |
          uvicorn app.backend.main:app --host 0.0.0.0 --port 8000 &

      - name: Wait for backend
        run: |
          curl --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            http://localhost:8000/health

      - name: Start frontend
        run: |
          python -m http.server 3000 --directory app/frontend &

      - name: Wait for frontend
        run: |
          curl --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            http://localhost:3000

      - name: Run E2E tests
        run: |
          pytest -m e2e -v \
            --junitxml=test-results/e2e-results.xml \
            --tracing=retain-on-failure \
            --screenshot=only-on-failure

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
  selenium-smokes:
    name: Selenium Compatibility Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Chrome version
        run: |
          google-chrome --version    

      - name: Start backend
        run: |
          uvicorn app.backend.main:app --host 0.0.0.0 --port 8000 &

      - name: Wait for backend
        run: |
          curl --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            http://localhost:8000/health

      - name: Start frontend
        run: |
          python -m http.server 3000 --directory app/frontend &
        
      - name: Wait for frontend
        run: |  
          curl --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            http://localhost:3000

      - name: Run Selenium smoke tests
        run: |
          pytest -m selenium -v \
            --junitxml=test-results/selenium-results.xml

      - name: Upload Selenium test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          path: test-results/
          if-no-files-found: ignore